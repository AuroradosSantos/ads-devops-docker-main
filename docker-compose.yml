services:
  app:
    build: .
    image: loja-api:1.0
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      MYSQL_HOST: mysql-db
      MYSQL_PORT: "3306"
      MYSQL_USER: loja_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-loja123}
      MYSQL_DATABASE: loja
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SECONDS: "60"
    depends_on:
      mysql-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-senha123}
      MYSQL_DATABASE: loja
      MYSQL_USER: loja_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-loja123}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/01-tabelas.sql:/docker-entrypoint-initdb.d/01-tabelas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
  redis_data:
