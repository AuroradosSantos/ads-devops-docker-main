apiVersion: apps/v1
kind: Deployment
metadata:
  name: loja-api
  namespace: n3-marcoandre
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loja-api
  template:
    metadata:
      labels:
        app: loja-api
    spec:
      containers:
        - name: api
          image: loja-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: MYSQL_HOST
              value: mysql-db
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_USER
              value: loja_app
            - name: MYSQL_DATABASE
              value: loja
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: loja-secrets
                  key: mysql-password
            - name: REDIS_URL
              value: redis://redis:6379
            - name: CACHE_TTL_SECONDS
              value: "60"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /live
              port: 3000
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /live
              port: 3000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: loja-api
  namespace: n3-marcoandre
spec:
  type: NodePort
  selector:
    app: loja-api
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080

